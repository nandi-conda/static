[workspace]
name = "static"
description = "Static site generator on ultra: markdown pages compiled to one LPython/WebAssembly app"
channels = ["https://conda.anaconda.org/conda-forge", "https://prefix.dev/nandi-testing"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
ultra = ">=0.1.20"         # from prefix.dev/nandi-testing; brings lpython 0.22
nodejs = ">=22"            # prerendering runs the site's wasm in node
markdown-it-py = ">=3"

[tasks]
build = { cmd = "python -m static build example", description = "Build the example site into example/dist" }
serve = { cmd = "python -m static serve example", description = "Serve the example on :8000, rebuilding on change" }
new = { cmd = "python -m static new", description = "pixi run new DIR: start a site from the example" }
test-unit = { cmd = "python -m unittest discover -s tests -v", description = "Codegen and content tests" }
install-playwright = { cmd = "npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium", description = "Fetch Playwright and Chromium for the browser test (cached after the first run)" }
test-e2e = { cmd = "python tests/run_e2e.py", depends-on = ["install-playwright"], description = "Build the example, serve it, run tests/e2e.cjs in Chromium" }
test = { depends-on = ["test-unit", "test-e2e"], description = "Unit and browser tests" }
